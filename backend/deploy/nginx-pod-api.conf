# nginx site for a server that already runs nginx on 80/443 (guide: backend/docs/deploy_hostinger.md).
# Install: cp to /etc/nginx/sites-available/pod-api, symlink into sites-enabled, nginx -t, reload,
# then: certbot --nginx -d <API_DOMAIN>   (adds the 443 block and the HTTP->HTTPS redirect)
server {
    listen 80;
    listen [::]:80;
    server_name 187-127-153-250.sslip.io;

    client_max_body_size 5m;            # audio is capped at 3 MB by the API

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite (not append) with the real connection IP, and drop headers a visitor could
        # fake: the app reads True-Client-IP / CF-Connecting-IP first, then X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header True-Client-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_read_timeout 60s;
    }
}
